name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - run: bun install --frozen-lockfile
      - run: bun run check
      # Row coverage (m2.md outcome 2) from the tracked tests/inventory export: no network, no secrets.
      - run: bun tools/inventory-trace.ts --check
      - uses: actions/cache@v4
        with:
          path: ~/.cache/effect-openapi-cli-generator
          key: corpus-${{ hashFiles('corpus/corpus.json') }}
      - run: env -u HTTP_PROXY -u HTTPS_PROXY -u http_proxy -u https_proxy bun run test
      - run: env -u HTTP_PROXY -u HTTPS_PROXY -u http_proxy -u https_proxy bun run corpus
